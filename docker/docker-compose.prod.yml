services:
  postgres:
    image: postgres:16-alpine
    container_name: iti-erp-postgres
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iti-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: iti-erp-api
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JwtSettings__Secret=${JwtSettings__Secret}
      - SeedAdmin__Password=${SeedAdmin__Password}
    volumes:
      - file-storage:/data/files
    restart: always
    networks:
      - iti-network

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: iti-erp-nginx
    ports:
      - "80:8080"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-certs:/etc/nginx/certs:ro
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: always
    networks:
      - iti-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=/api/v1
    container_name: iti-erp-frontend
    volumes:
      - frontend-dist:/usr/share/nginx/html
    restart: always
    networks:
      - iti-network

volumes:
  pgdata:
  nginx-certs:
  file-storage:
  frontend-dist:

networks:
  iti-network:
    driver: bridge
